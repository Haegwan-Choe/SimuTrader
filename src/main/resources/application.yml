server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:investsim;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE # ???? H2 DB ??
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
